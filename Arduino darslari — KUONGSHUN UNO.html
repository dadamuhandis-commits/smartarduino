<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arduino darslari — KUONGSHUN UNO</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--panel:#121a30;--panel2:#0d1426;--ink:#eaf0ff;--mute:#a3b3d6;--line:#2a3860;--r:#ff5468;--g:#34e08a;--b:#5b97ff;--a:var(--b);--accent:var(--b);--accent-ink:#07101f;--code-bg:#070c18;--code-ink:#dbe6ff;--c-com:#7283ad;--c-str:#34e08a;--c-kw:#ff7a8a;--c-pre:#6ea8ff;--c-num:#ffd166;--warn:#2d2a14;--warn-ink:#ffe08a;--ok:#0f2c22;--ok-ink:#9af0c3;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:radial-gradient(800px 420px at 0 0,#ff546826,transparent 62%),radial-gradient(800px 480px at 100% 0,#5b97ff26,transparent 62%),radial-gradient(900px 520px at 50% 100%,#34e08a1c,transparent 62%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.6 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:30}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:12px}
.top b{font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;font-size:14px}
.btn:hover{border-color:var(--a)}
.btn.pri{background:var(--a);color:var(--accent-ink);border-color:var(--a);font-weight:600}
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto}
.brand::after{content:"";display:block;height:4px;margin-top:8px;border-radius:2px;background:linear-gradient(90deg,var(--r),var(--g),var(--b))}
.brand{display:block;text-decoration:none;font-weight:600;font-size:18px;line-height:1.25;margin-bottom:2px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;margin-bottom:10px}
.list{list-style:none;margin:0;padding:0}
.list a{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:6px;text-decoration:none;font-size:15px}
.list a:hover{background:var(--panel2)}
.list a[aria-current=page]{background:var(--a);color:var(--accent-ink);font-weight:500}
.list a[aria-current=page] .n{color:var(--accent-ink)}
.list .n{font:500 13px "IBM Plex Mono",ui-monospace,monospace;min-width:24px;text-align:right;color:var(--a)}
main{padding:40px clamp(18px,5vw,64px) 72px;max-width:920px;width:100%}
h1{font-size:clamp(28px,4.4vw,40px);line-height:1.15;margin:0 0 8px;font-weight:600;letter-spacing:-.01em}
h2{font-size:19px;margin:32px 0 10px;font-weight:600;border-left:4px solid var(--a);padding-left:10px}
.chip{display:inline-block;font:600 13px "IBM Plex Mono",monospace;background:var(--a);color:var(--accent-ink);border-radius:4px;padding:2px 8px;margin-bottom:10px}
.lead{color:var(--mute);max-width:62ch;margin:0 0 8px}
ol.steps{padding-left:22px;max-width:66ch}
ol.steps li{margin:6px 0}
.note{border-left:4px solid;border-radius:8px;padding:10px 14px;margin:10px 0;font-size:15px;max-width:70ch}
.note.warn{background:var(--warn);color:var(--warn-ink);border-color:#ffd166}
.note.ok{background:var(--ok);color:var(--ok-ink);border-color:var(--g)}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--a);border-radius:8px;padding:6px 16px}
.card p{margin:10px 0}
.card .w{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px}
.code{margin:12px 0 22px;border-radius:8px;overflow:hidden;background:var(--code-bg);border:1px solid var(--line);border-top:3px solid var(--a)}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #ffffff1f;color:#aebfc9;font:500 13px "IBM Plex Mono",monospace;flex-wrap:wrap}
.bar .btn{background:transparent;color:#d8e4ea;border-color:#ffffff33;padding:3px 10px;font-size:13px}
.bar .btn:hover{border-color:var(--a);color:var(--a)}
.bar div{display:flex;gap:6px}
pre{margin:0;padding:14px 16px;overflow-x:auto;color:var(--code-ink);font:14px/1.55 "IBM Plex Mono",ui-monospace,monospace;tab-size:2}
.c{color:var(--c-com)}.s{color:var(--c-str)}.k{color:var(--c-kw)}.p{color:var(--c-pre)}.d{color:var(--c-num)}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
.pn a{text-decoration:none}
.grid{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.grid a{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-top:3px solid var(--a);background:var(--panel);border-radius:8px;text-decoration:none;font-size:15px}
.grid a:hover{border-color:var(--a);background:var(--panel2)}
.grid .n{font:600 13px "IBM Plex Mono",monospace;color:var(--a)}
.otgl{display:block;text-align:center;text-decoration:none;margin-bottom:10px;border-color:var(--g);color:var(--g);font-weight:500}
.sec{font-size:13px;margin:16px 0 6px;border:0;padding:0;color:var(--mute);font-weight:600}
.empty{color:var(--mute);font-size:14px;padding:6px 8px}
.fig{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--a);border-radius:8px;padding:12px 14px;margin:0 0 6px}
.dg{display:block;width:100%;max-width:660px;height:auto;margin:0 auto}
.dg .bx{fill:var(--panel2);stroke:var(--line);stroke-width:1.5}
.dg text{fill:var(--ink);font-family:"IBM Plex Mono",ui-monospace,monospace}
.dg .tt{font-size:13px;font-weight:500}
.dg .lb{font-size:12px}
.cap{color:var(--mute);font-size:14px;margin:8px 0 0;max-width:70ch}
@media (max-width:820px){
 .top{display:flex}
 .app{display:block}
 aside{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);height:100%;z-index:40;transform:translateX(-102%);padding-top:calc(env(safe-area-inset-top,0px) + 16px);transition:transform .18s}
 aside.open{transform:none;box-shadow:0 0 0 100vmax #00000066}
 main{padding-top:24px}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<div class="top"><button class="btn" id="menu" aria-expanded="false" aria-controls="side">Darslar</button><b>Arduino darslari</b></div>
<div class="app">
<aside id="side">
<a class="brand" href="#/">Arduino darslari</a>
<p class="sub" id="sub"></p>

<input type="search" id="q" placeholder="Dars qidirish (nom yoki raqam)" aria-label="Dars qidirish">
<h2 class="sec">Darslar</h2><ul class="list" id="list"></ul>
<h2 class="sec">Robot loyihalari</h2><ul class="list" id="plist"></ul>
</aside>
<main id="main" tabindex="-1"></main>
</div>
<script>
const L = [{"n": 2, "title": "Blink", "notes": ["UNO R3 platasidagi o'rnatilgan 'L' LED (13-pin) yonib-o'chishi.", "Qo'shimcha komponent kerak emas."], "files": [{"name": "Lesson_02_Blink.ino", "code": "/*\n  Lesson 2: Blink\n  UNO R3 platasidagi o'rnatilgan 'L' LED (13-pin) yonib-o'chishi.\n  Qo'shimcha komponent kerak emas.\n*/\n\nint led = 13;\n\nvoid setup() {\n  pinMode(led, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(led, HIGH); // LED yonadi\n  delay(1000);             // 1 soniya kutish\n  digitalWrite(led, LOW);  // LED o'chadi\n  delay(1000);             // 1 soniya kutish\n}\n"}]}, {"n": 3, "title": "LED", "notes": ["5mm qizil LED, 220ohm rezistor orqali Pin 13 ga ulanadi (yoki istalgan raqamli pin)."], "files": [{"name": "Lesson_03_LED.ino", "code": "/*\n  Lesson 3: LED\n  5mm qizil LED, 220ohm rezistor orqali Pin 13 ga ulanadi (yoki istalgan raqamli pin).\n*/\n\nint ledPin = 13;\n\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(ledPin, HIGH);\n  delay(1000);\n  digitalWrite(ledPin, LOW);\n  delay(1000);\n}\n"}]}, {"n": 4, "title": "RGB LED", "notes": ["BLUE -> Pin 3, GREEN -> Pin 5, RED -> Pin 6 (har biriga 220ohm rezistor bilan)", "Rang RED -> GREEN -> BLUE -> RED aylanib turadi."], "files": [{"name": "Lesson_04_RGB_LED.ino", "code": "/*\n  Lesson 4: RGB LED\n  BLUE -> Pin 3, GREEN -> Pin 5, RED -> Pin 6 (har biriga 220ohm rezistor bilan)\n  Rang RED -> GREEN -> BLUE -> RED aylanib turadi.\n*/\n\n#define BLUE 3\n#define GREEN 5\n#define RED 6\n\nint redValue = 255;\nint greenValue = 0;\nint blueValue = 0;\n\n#define delayTime 10\n\nvoid setup() {\n  pinMode(RED, OUTPUT);\n  pinMode(GREEN, OUTPUT);\n  pinMode(BLUE, OUTPUT);\n  digitalWrite(RED, HIGH);\n  digitalWrite(GREEN, LOW);\n  digitalWrite(BLUE, LOW);\n}\n\nvoid setColor(int r, int g, int b) {\n  analogWrite(RED, r);\n  analogWrite(GREEN, g);\n  analogWrite(BLUE, b);\n}\n\nvoid loop() {\n  // RED -> GREEN\n  for (int i = 0; i < 255; i++) {\n    redValue -= 1;\n    greenValue += 1;\n    setColor(redValue, greenValue, blueValue);\n    delay(delayTime);\n  }\n  // GREEN -> BLUE\n  for (int i = 0; i < 255; i++) {\n    greenValue -= 1;\n    blueValue += 1;\n    setColor(redValue, greenValue, blueValue);\n    delay(delayTime);\n  }\n  // BLUE -> RED\n  for (int i = 0; i < 255; i++) {\n    blueValue -= 1;\n    redValue += 1;\n    setColor(redValue, greenValue, blueValue);\n    delay(delayTime);\n  }\n}\n"}]}, {"n": 5, "title": "Digital Inputs", "notes": ["Ikki tugma: A tugmasi LEDni yoqadi, B tugmasi o'chiradi.", "ledPin -> 13, buttonApin -> 2, buttonBpin -> 4 (INPUT_PULLUP, tugma GND ga ulanadi)"], "files": [{"name": "Lesson_05_Digital_Inputs.ino", "code": "/*\n  Lesson 5: Digital Inputs\n  Ikki tugma: A tugmasi LEDni yoqadi, B tugmasi o'chiradi.\n  ledPin -> 13, buttonApin -> 2, buttonBpin -> 4 (INPUT_PULLUP, tugma GND ga ulanadi)\n*/\n\nint ledPin = 13;\nint buttonApin = 2;\nint buttonBpin = 4;\n\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n  pinMode(buttonApin, INPUT_PULLUP);\n  pinMode(buttonBpin, INPUT_PULLUP);\n}\n\nvoid loop() {\n  if (digitalRead(buttonApin) == LOW) {\n    digitalWrite(ledPin, HIGH);\n  }\n  if (digitalRead(buttonBpin) == LOW) {\n    digitalWrite(ledPin, LOW);\n  }\n}\n"}]}, {"n": 6, "title": "Active Buzzer", "notes": ["Aktiv buzzer -> Pin 8 (musbat), GND (manfiy)"], "files": [{"name": "Lesson_06_Active_Buzzer.ino", "code": "/*\n  Lesson 6: Active Buzzer\n  Aktiv buzzer -> Pin 8 (musbat), GND (manfiy)\n*/\n\nint buzzerPin = 8;\n\nvoid setup() {\n  pinMode(buzzerPin, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(buzzerPin, HIGH);\n  delay(500);\n  digitalWrite(buzzerPin, LOW);\n  delay(500);\n}\n"}]}, {"n": 7, "title": "Passive Buzzer", "notes": ["Passiv buzzer -> Pin 8 (qizil musbat), GND (qora manfiy)", "8 ta notani (Do-Re-Mi-Fa-So-La-Si-Do) 0.5 soniyadan chalib beradi.", "pitches.h kutubxonasi kerak (Arduino misollarida mavjud)."], "files": [{"name": "Lesson_07_Passive_Buzzer.ino", "code": "/*\n  Lesson 7: Passive Buzzer\n  Passiv buzzer -> Pin 8 (qizil musbat), GND (qora manfiy)\n  8 ta notani (Do-Re-Mi-Fa-So-La-Si-Do) 0.5 soniyadan chalib beradi.\n  pitches.h kutubxonasi kerak (Arduino misollarida mavjud).\n*/\n\n#include \"pitches.h\"\n\nint buzzerPin = 8;\n\nint melody[] = {\n  NOTE_C5, NOTE_D5, NOTE_E5, NOTE_F5, NOTE_G5, NOTE_A5, NOTE_B5, NOTE_C6\n};\n\nvoid setup() {\n}\n\nvoid loop() {\n  for (int i = 0; i < 8; i++) {\n    tone(buzzerPin, melody[i], 500);\n    delay(600);\n  }\n  noTone(buzzerPin);\n  delay(2000);\n}\n"}, {"name": "pitches.h", "code": "// Nota chastotalari (standart Arduino pitches.h qisqartirilgan versiyasi)\n#define NOTE_C5  523\n#define NOTE_D5  587\n#define NOTE_E5  659\n#define NOTE_F5  698\n#define NOTE_G5  784\n#define NOTE_A5  880\n#define NOTE_B5  988\n#define NOTE_C6  1047\n"}]}, {"n": 8, "title": "Tilt Ball Switch", "notes": ["Sensor -> Pin 8 (signal), 5V, GND", "Qiyalik aniqlansa, built-in LED (13) yonadi."], "files": [{"name": "Lesson_08_Tilt_Ball_Switch.ino", "code": "/*\n  Lesson 8: Tilt Ball Switch\n  Sensor -> Pin 8 (signal), 5V, GND\n  Qiyalik aniqlansa, built-in LED (13) yonadi.\n*/\n\nint tiltPin = 8;\nint ledPin = 13;\n\nvoid setup() {\n  pinMode(tiltPin, INPUT);\n  pinMode(ledPin, OUTPUT);\n  Serial.begin(9600);\n}\n\nvoid loop() {\n  int state = digitalRead(tiltPin);\n  if (state == HIGH) {\n    digitalWrite(ledPin, HIGH);\n    Serial.println(\"Qiyalik aniqlandi\");\n  } else {\n    digitalWrite(ledPin, LOW);\n  }\n  delay(200);\n}\n"}]}, {"n": 9, "title": "Servo (SG90)", "notes": ["Jigarrang -> GND, Qizil -> 5V, Oranj (signal) -> Pin 9", "Servo kutubxonasi kerak (Arduino IDE bilan birga keladi)."], "files": [{"name": "Lesson_09_Servo.ino", "code": "/*\n  Lesson 9: Servo (SG90)\n  Jigarrang -> GND, Qizil -> 5V, Oranj (signal) -> Pin 9\n  Servo kutubxonasi kerak (Arduino IDE bilan birga keladi).\n*/\n\n#include <Servo.h>\n\nServo myServo;\n\nvoid setup() {\n  myServo.attach(9);\n}\n\nvoid loop() {\n  for (int pos = 0; pos <= 180; pos++) {\n    myServo.write(pos);\n    delay(15);\n  }\n  for (int pos = 180; pos >= 0; pos--) {\n    myServo.write(pos);\n    delay(15);\n  }\n}\n"}]}, {"n": 10, "title": "Ultrasonic Sensor Module (HC-SR04)", "notes": ["VCC -> 5V, GND -> GND, Trig -> Pin 9, Echo -> Pin 10", "Kutubxona kerak emas, kodda o'zi hisoblanadi."], "files": [{"name": "Lesson_10_Ultrasonic_Sensor.ino", "code": "/*\n  Lesson 10: Ultrasonic Sensor Module (HC-SR04)\n  VCC -> 5V, GND -> GND, Trig -> Pin 9, Echo -> Pin 10\n  Kutubxona kerak emas, kodda o'zi hisoblanadi.\n*/\n\nint trigPin = 9;\nint echoPin = 10;\n\nvoid setup() {\n  pinMode(trigPin, OUTPUT);\n  pinMode(echoPin, INPUT);\n  Serial.begin(9600);\n}\n\nvoid loop() {\n  digitalWrite(trigPin, LOW);\n  delayMicroseconds(2);\n  digitalWrite(trigPin, HIGH);\n  delayMicroseconds(10);\n  digitalWrite(trigPin, LOW);\n\n  long duration = pulseIn(echoPin, HIGH);\n  float distanceCm = duration * 0.034 / 2;\n\n  Serial.print(\"Masofa: \");\n  Serial.print(distanceCm);\n  Serial.println(\" sm\");\n\n  delay(500);\n}\n"}]}, {"n": 11, "title": "Membrane Switch Module (4x4 Matrix Keypad)", "notes": ["8 pin -> D9-D2 (birinchi pin D9, oxirgi pin D2)", "Keypad kutubxonasi kerak: Library Manager'dan \"Keypad\" (Mark Stanley, Alexander Brevig)"], "files": [{"name": "Lesson_11_Membrane_Switch.ino", "code": "/*\n  Lesson 11: Membrane Switch Module (4x4 Matrix Keypad)\n  8 pin -> D9-D2 (birinchi pin D9, oxirgi pin D2)\n  Keypad kutubxonasi kerak: Library Manager'dan \"Keypad\" (Mark Stanley, Alexander Brevig)\n*/\n\n#include <Keypad.h>\n\nconst byte ROWS = 4;\nconst byte COLS = 4;\n\nchar keys[ROWS][COLS] = {\n  {'1','2','3','A'},\n  {'4','5','6','B'},\n  {'7','8','9','C'},\n  {'*','0','#','D'}\n};\n\nbyte rowPins[ROWS] = {9, 8, 7, 6};\nbyte colPins[COLS] = {5, 4, 3, 2};\n\nKeypad keypad = Keypad(makeKeymap(keys), rowPins, colPins, ROWS, COLS);\n\nvoid setup() {\n  Serial.begin(9600);\n}\n\nvoid loop() {\n  char key = keypad.getKey();\n  if (key) {\n    Serial.println(key);\n  }\n}\n"}]}, {"n": 12, "title": "DHT11 Temperature and Humidity Sensor", "notes": ["VCC -> 5V, GND -> GND, DATA -> Pin 8", "Kutubxona kerak: Library Manager'dan \"SimpleDHT\" yoki \"DHT sensor library\""], "files": [{"name": "Lesson_12_DHT11.ino", "code": "/*\n  Lesson 12: DHT11 Temperature and Humidity Sensor\n  VCC -> 5V, GND -> GND, DATA -> Pin 8\n  Kutubxona kerak: Library Manager'dan \"SimpleDHT\" yoki \"DHT sensor library\"\n*/\n\n#include <SimpleDHT.h>\n\nint dataPin = 8;\nSimpleDHT11 dht11(dataPin);\n\nvoid setup() {\n  Serial.begin(9600);\n}\n\nvoid loop() {\n  byte temperature = 0;\n  byte humidity = 0;\n  int err = dht11.read(&temperature, &humidity, NULL);\n  if (err == SimpleDHTErrSuccess) {\n    Serial.print(\"Harorat: \");\n    Serial.print((int)temperature);\n    Serial.print(\" C, Namlik: \");\n    Serial.print((int)humidity);\n    Serial.println(\" %\");\n  } else {\n    Serial.println(\"Sensor xatosi\");\n  }\n  delay(2000);\n}\n"}]}, {"n": 13, "title": "Analog Joystick Module", "notes": ["VCC -> 5V, GND -> GND, X -> A0, Y -> A1, Key -> Pin 2"], "files": [{"name": "Lesson_13_Analog_Joystick.ino", "code": "/*\n  Lesson 13: Analog Joystick Module\n  VCC -> 5V, GND -> GND, X -> A0, Y -> A1, Key -> Pin 2\n*/\n\nint xPin = A0;\nint yPin = A1;\nint keyPin = 2;\n\nvoid setup() {\n  pinMode(keyPin, INPUT_PULLUP);\n  Serial.begin(9600);\n}\n\nvoid loop() {\n  int xValue = analogRead(xPin);\n  int yValue = analogRead(yPin);\n  int keyValue = digitalRead(keyPin);\n\n  Serial.print(\"X: \");\n  Serial.print(xValue);\n  Serial.print(\" | Y: \");\n  Serial.print(yValue);\n  Serial.print(\" | Key: \");\n  Serial.println(keyValue == LOW ? \"Bosildi\" : \"Bosilmadi\");\n\n  delay(300);\n}\n"}]}, {"n": 14, "title": "IR Receiver Module", "notes": ["\"-\" -> GND, \"S\" -> Pin 11 (signal), o'rta pin -> 5V", "Kutubxona kerak: Library Manager'dan \"IRremote\"", "Diqqat: agar <RobotIRremote> kutubxonasi o'rnatilgan bo'lsa, u konflikt beradi,", "libraries papkasidan vaqtincha olib tashlang."], "files": [{"name": "Lesson_14_IR_Receiver.ino", "code": "/*\n  Lesson 14: IR Receiver Module\n  \"-\" -> GND, \"S\" -> Pin 11 (signal), o'rta pin -> 5V\n  Kutubxona kerak: Library Manager'dan \"IRremote\"\n  Diqqat: agar <RobotIRremote> kutubxonasi o'rnatilgan bo'lsa, u konflikt beradi,\n  libraries papkasidan vaqtincha olib tashlang.\n*/\n\n#include <IRremote.hpp>\n\nint irPin = 11;\n\nvoid setup() {\n  Serial.begin(9600);\n  IrReceiver.begin(irPin);\n}\n\nvoid loop() {\n  if (IrReceiver.decode()) {\n    Serial.print(\"IR kod: 0x\");\n    Serial.println(IrReceiver.decodedIRData.decodedRawData, HEX);\n    IrReceiver.resume();\n  }\n}\n"}]}, {"n": 15, "title": "MAX7219 LED Dot Matrix Module", "notes": ["VCC -> 5V, GND -> GND, DIN -> Pin 12, CS -> Pin 11, CLK -> Pin 10", "Kutubxona kerak: Library Manager'dan \"LedControl\""], "files": [{"name": "Lesson_15_MAX7219_Dot_Matrix.ino", "code": "/*\n  Lesson 15: MAX7219 LED Dot Matrix Module\n  VCC -> 5V, GND -> GND, DIN -> Pin 12, CS -> Pin 11, CLK -> Pin 10\n  Kutubxona kerak: Library Manager'dan \"LedControl\"\n*/\n\n#include <LedControl.h>\n\nLedControl lc = LedControl(12, 10, 11, 1); // DIN, CLK, CS, modullar soni\n\nvoid setup() {\n  lc.shutdown(0, false);\n  lc.setIntensity(0, 8);\n  lc.clearDisplay(0);\n}\n\nvoid loop() {\n  for (int row = 0; row < 8; row++) {\n    for (int col = 0; col < 8; col++) {\n      lc.setLed(0, row, col, true);\n      delay(50);\n    }\n  }\n  delay(500);\n  lc.clearDisplay(0);\n  delay(500);\n}\n"}]}, {"n": 16, "title": "GY-521 Module (MPU6050)", "notes": ["VCC -> 5V, GND -> GND, SDA -> A4, SCL -> A5", "Kutubxona kerak: Library Manager'dan \"MPU6050\" (Electronic Cats yoki Adafruit)"], "files": [{"name": "Lesson_16_GY521.ino", "code": "/*\n  Lesson 16: GY-521 Module (MPU6050)\n  VCC -> 5V, GND -> GND, SDA -> A4, SCL -> A5\n  Kutubxona kerak: Library Manager'dan \"MPU6050\" (Electronic Cats yoki Adafruit)\n*/\n\n#include <Wire.h>\n\nconst int MPU_addr = 0x68;\nint16_t AcX, AcY, AcZ, Tmp, GyX, GyY, GyZ;\n\nvoid setup() {\n  Wire.begin();\n  Wire.beginTransmission(MPU_addr);\n  Wire.write(0x6B);\n  Wire.write(0);\n  Wire.endTransmission(true);\n  Serial.begin(9600);\n}\n\nvoid loop() {\n  Wire.beginTransmission(MPU_addr);\n  Wire.write(0x3B);\n  Wire.endTransmission(false);\n  Wire.requestFrom(MPU_addr, 14, true);\n\n  AcX = Wire.read() << 8 | Wire.read();\n  AcY = Wire.read() << 8 | Wire.read();\n  AcZ = Wire.read() << 8 | Wire.read();\n  Tmp = Wire.read() << 8 | Wire.read();\n  GyX = Wire.read() << 8 | Wire.read();\n  GyY = Wire.read() << 8 | Wire.read();\n  GyZ = Wire.read() << 8 | Wire.read();\n\n  Serial.print(\"AcX=\"); Serial.print(AcX);\n  Serial.print(\" AcY=\"); Serial.print(AcY);\n  Serial.print(\" AcZ=\"); Serial.print(AcZ);\n  Serial.print(\" GyX=\"); Serial.print(GyX);\n  Serial.print(\" GyY=\"); Serial.print(GyY);\n  Serial.print(\" GyZ=\"); Serial.println(GyZ);\n\n  delay(500);\n}\n"}]}, {"n": 17, "title": "AM312 PIR Sensor", "notes": ["VCC -> 5V, GND -> GND, OUT -> Pin 7", "Harakat aniqlansa, built-in LED (13) yonadi."], "files": [{"name": "Lesson_17_AM312_PIR.ino", "code": "/*\n  Lesson 17: AM312 PIR Sensor\n  VCC -> 5V, GND -> GND, OUT -> Pin 7\n  Harakat aniqlansa, built-in LED (13) yonadi.\n*/\n\nint pirPin = 7;\nint ledPin = 13;\n\nvoid setup() {\n  pinMode(pirPin, INPUT);\n  pinMode(ledPin, OUTPUT);\n  Serial.begin(9600);\n  Serial.println(\"PIR isinmoqda, 1 daqiqa kuting...\");\n  delay(60000); // sensor barqarorlashishi uchun\n}\n\nvoid loop() {\n  int motion = digitalRead(pirPin);\n  if (motion == HIGH) {\n    digitalWrite(ledPin, HIGH);\n    Serial.println(\"Harakat aniqlandi!\");\n  } else {\n    digitalWrite(ledPin, LOW);\n  }\n  delay(200);\n}\n"}]}, {"n": 18, "title": "Water Level Detection Sensor Module", "notes": ["VCC -> 5V, GND -> GND, S -> A0"], "files": [{"name": "Lesson_18_Water_Level.ino", "code": "/*\n  Lesson 18: Water Level Detection Sensor Module\n  VCC -> 5V, GND -> GND, S -> A0\n*/\n\nint sensorPin = A0;\n\nvoid setup() {\n  Serial.begin(9600);\n}\n\nvoid loop() {\n  int level = analogRead(sensorPin);\n  Serial.print(\"Suv sathi: \");\n  Serial.println(level);\n  delay(500);\n}\n"}]}, {"n": 19, "title": "Real Time Clock Module (DS1307/DS3231)", "notes": ["SCL -> SCL, SDA -> SDA, VCC -> 5V, GND -> GND", "Kutubxona kerak: Library Manager'dan \"RTClib\" (Adafruit)"], "files": [{"name": "Lesson_19_RTC.ino", "code": "/*\n  Lesson 19: Real Time Clock Module (DS1307/DS3231)\n  SCL -> SCL, SDA -> SDA, VCC -> 5V, GND -> GND\n  Kutubxona kerak: Library Manager'dan \"RTClib\" (Adafruit)\n*/\n\n#include <Wire.h>\n#include <RTClib.h>\n\nRTC_DS1307 rtc;\n\nvoid setup() {\n  Serial.begin(9600);\n  if (!rtc.begin()) {\n    Serial.println(\"RTC topilmadi!\");\n    while (1);\n  }\n  if (!rtc.isrunning()) {\n    // Kompyuter vaqtini RTC ga yozib qo'yadi (bir marta ishlatiladi)\n    rtc.adjust(DateTime(F(__DATE__), F(__TIME__)));\n  }\n}\n\nvoid loop() {\n  DateTime now = rtc.now();\n  Serial.print(now.year()); Serial.print('/');\n  Serial.print(now.month()); Serial.print('/');\n  Serial.print(now.day()); Serial.print(' ');\n  Serial.print(now.hour()); Serial.print(':');\n  Serial.print(now.minute()); Serial.print(':');\n  Serial.println(now.second());\n  delay(1000);\n}\n"}]}, {"n": 20, "title": "Sound Sensor Module", "notes": ["VCC -> 5V, GND -> GND, AO -> A0 (analog), DO -> Pin 11 (digital)"], "files": [{"name": "Lesson_20_Sound_Sensor.ino", "code": "/*\n  Lesson 20: Sound Sensor Module\n  VCC -> 5V, GND -> GND, AO -> A0 (analog), DO -> Pin 11 (digital)\n*/\n\nint analogPin = A0;\nint digitalPin = 11;\nint ledPin = 13;\n\nvoid setup() {\n  pinMode(digitalPin, INPUT);\n  pinMode(ledPin, OUTPUT);\n  Serial.begin(9600);\n}\n\nvoid loop() {\n  int analogValue = analogRead(analogPin);\n  int digitalValue = digitalRead(digitalPin);\n\n  Serial.print(\"Analog: \");\n  Serial.print(analogValue);\n  Serial.print(\" | Digital: \");\n  Serial.println(digitalValue);\n\n  digitalWrite(ledPin, digitalValue == HIGH ? HIGH : LOW);\n\n  delay(200);\n}\n"}]}, {"n": 21, "title": "RC522 RFID Module", "notes": ["SDA(SS) -> Pin 10, SCK -> 13, MOSI -> 11, MISO -> 12, RST -> Pin 9, VCC -> 3.3V, GND -> GND", "Kutubxona kerak: Library Manager'dan \"MFRC522\" (GithubCommunity)"], "files": [{"name": "Lesson_21_RC522_RFID.ino", "code": "/*\n  Lesson 21: RC522 RFID Module\n  SDA(SS) -> Pin 10, SCK -> 13, MOSI -> 11, MISO -> 12, RST -> Pin 9, VCC -> 3.3V, GND -> GND\n  Kutubxona kerak: Library Manager'dan \"MFRC522\" (GithubCommunity)\n*/\n\n#include <SPI.h>\n#include <MFRC522.h>\n\n#define RST_PIN 9\n#define SS_PIN 10\n\nMFRC522 mfrc522(SS_PIN, RST_PIN);\n\nvoid setup() {\n  Serial.begin(9600);\n  SPI.begin();\n  mfrc522.PCD_Init();\n  Serial.println(\"Kartani yaqinlashtiring...\");\n}\n\nvoid loop() {\n  if (!mfrc522.PICC_IsNewCardPresent()) return;\n  if (!mfrc522.PICC_ReadCardSerial()) return;\n\n  Serial.print(\"Karta UID: \");\n  for (byte i = 0; i < mfrc522.uid.size; i++) {\n    Serial.print(mfrc522.uid.uidByte[i], HEX);\n    Serial.print(\" \");\n  }\n  Serial.println();\n}\n"}]}, {"n": 22, "title": "LCD Display (LCD1602)", "notes": ["RS->7, E->8, D4->9, D5->10, D6->11, D7->12, VSS->GND, VDD->5V, VO->pot slayder,", "RW->GND, A->5V (orqa yorug'lik), K->GND", "Kutubxona kerak emas, LiquidCrystal Arduino bilan birga keladi."], "files": [{"name": "Lesson_22_LCD_Display.ino", "code": "/*\n  Lesson 22: LCD Display (LCD1602)\n  RS->7, E->8, D4->9, D5->10, D6->11, D7->12, VSS->GND, VDD->5V, VO->pot slayder,\n  RW->GND, A->5V (orqa yorug'lik), K->GND\n  Kutubxona kerak emas, LiquidCrystal Arduino bilan birga keladi.\n*/\n\n#include <LiquidCrystal.h>\n\n// RS, E, D4, D5, D6, D7\nLiquidCrystal lcd(7, 8, 9, 10, 11, 12);\n\nvoid setup() {\n  lcd.begin(16, 2);\n  lcd.print(\"Hello, World!\");\n}\n\nvoid loop() {\n  lcd.setCursor(0, 1);\n  lcd.print(millis() / 1000);\n}\n"}]}, {"n": 23, "title": "Thermometer (Thermistor + LCD1602)", "notes": ["LCD ulanishi Lesson 22 bilan bir xil.", "Termistor -> A0 (10k rezistor bilan birga, potensiometr sxemasi)"], "files": [{"name": "Lesson_23_Thermometer.ino", "code": "/*\n  Lesson 23: Thermometer (Thermistor + LCD1602)\n  LCD ulanishi Lesson 22 bilan bir xil.\n  Termistor -> A0 (10k rezistor bilan birga, potensiometr sxemasi)\n*/\n\n#include <LiquidCrystal.h>\n\n// BS E D4 D5 D6 D7\nLiquidCrystal lcd(7, 8, 9, 10, 11, 12);\n\nint tempPin = A0;\n\nvoid setup() {\n  lcd.begin(16, 2);\n}\n\nvoid loop() {\n  int tempReading = analogRead(tempPin);\n  double tempK = log(10000.0 * ((1024.0 / tempReading - 1)));\n  tempK = 1 / (0.001129148 + (0.000234125 + (0.0000000876741 * tempK * tempK)) * tempK);\n  float tempC = tempK - 273.15;\n  float tempF = (tempC * 9.0) / 5.0 + 32.0;\n\n  lcd.setCursor(0, 0);\n  lcd.print(\"Temp C        \");\n  lcd.setCursor(6, 0);\n  lcd.print(tempC);\n\n  lcd.setCursor(0, 1);\n  lcd.print(\"Temp F        \");\n  lcd.setCursor(6, 1);\n  lcd.print(tempF);\n\n  delay(1000);\n}\n"}]}, {"n": 24, "title": "Eight LED with 74HC595", "notes": ["Digital 12 -> pin14 (DATA), Digital 11 -> pin12 (LATCH), Digital 9 -> pin11 (CLOCK)", "8 ta LED 74HC595 chiqishlariga, har biriga 220ohm rezistor bilan ulanadi."], "files": [{"name": "Lesson_24_8LED_74HC595.ino", "code": "/*\n  Lesson 24: Eight LED with 74HC595\n  Digital 12 -> pin14 (DATA), Digital 11 -> pin12 (LATCH), Digital 9 -> pin11 (CLOCK)\n  8 ta LED 74HC595 chiqishlariga, har biriga 220ohm rezistor bilan ulanadi.\n*/\n\nint latchPin = 11;\nint clockPin = 9;\nint dataPin = 12;\n\nbyte leds = 0;\n\nvoid setup() {\n  pinMode(latchPin, OUTPUT);\n  pinMode(dataPin, OUTPUT);\n  pinMode(clockPin, OUTPUT);\n}\n\nvoid updateShiftRegister() {\n  digitalWrite(latchPin, LOW);\n  shiftOut(dataPin, clockPin, LSBFIRST, leds);\n  digitalWrite(latchPin, HIGH);\n}\n\nvoid loop() {\n  leds = 0;\n  updateShiftRegister();\n  delay(500);\n\n  for (int i = 0; i < 8; i++) {\n    bitSet(leds, i);\n    updateShiftRegister();\n    delay(500);\n  }\n}\n"}]}, {"n": 25, "title": "The Serial Monitor", "notes": ["Lesson 24 bilan bir xil ulanish (8 LED + 74HC595).", "Serial Monitor orqali 0-7 raqam yuborib, tegishli LEDni yoqish; 'x' bilan hammasini o'chirish."], "files": [{"name": "Lesson_25_Serial_Monitor.ino", "code": "/*\n  Lesson 25: The Serial Monitor\n  Lesson 24 bilan bir xil ulanish (8 LED + 74HC595).\n  Serial Monitor orqali 0-7 raqam yuborib, tegishli LEDni yoqish; 'x' bilan hammasini o'chirish.\n*/\n\nint latchPin = 11;\nint clockPin = 9;\nint dataPin = 12;\n\nbyte leds = 0;\n\nvoid setup() {\n  pinMode(latchPin, OUTPUT);\n  pinMode(dataPin, OUTPUT);\n  pinMode(clockPin, OUTPUT);\n  updateShiftRegister();\n  Serial.begin(9600);\n  while (!Serial);\n  Serial.println(\"0 dan 7 gacha LED raqamini yoki 'x' ni kiriting\");\n}\n\nvoid updateShiftRegister() {\n  digitalWrite(latchPin, LOW);\n  shiftOut(dataPin, clockPin, LSBFIRST, leds);\n  digitalWrite(latchPin, HIGH);\n}\n\nvoid loop() {\n  if (Serial.available()) {\n    char ch = Serial.read();\n\n    if (ch >= '0' && ch <= '7') {\n      int led = ch - '0';\n      bitSet(leds, led);\n      updateShiftRegister();\n      Serial.print(\"Yoqildi: LED \");\n      Serial.println(led);\n    }\n\n    if (ch == 'x') {\n      leds = 0;\n      updateShiftRegister();\n      Serial.println(\"Tozalandi\");\n    }\n  }\n}\n"}]}, {"n": 26, "title": "Photocell", "notes": ["Lesson 24 bilan bir xil (8 LED + 74HC595), pot o'rniga fotorezistor + 1k rezistor -> A0", "Yorug'lik darajasiga qarab LEDlar soni o'zgaradi."], "files": [{"name": "Lesson_26_Photocell.ino", "code": "/*\n  Lesson 26: Photocell\n  Lesson 24 bilan bir xil (8 LED + 74HC595), pot o'rniga fotorezistor + 1k rezistor -> A0\n  Yorug'lik darajasiga qarab LEDlar soni o'zgaradi.\n*/\n\nint latchPin = 11;\nint clockPin = 9;\nint dataPin = 12;\nint lightPin = A0;\n\nbyte leds = 0;\n\nvoid setup() {\n  pinMode(latchPin, OUTPUT);\n  pinMode(dataPin, OUTPUT);\n  pinMode(clockPin, OUTPUT);\n}\n\nvoid updateShiftRegister() {\n  digitalWrite(latchPin, LOW);\n  shiftOut(dataPin, clockPin, LSBFIRST, leds);\n  digitalWrite(latchPin, HIGH);\n}\n\nvoid loop() {\n  int reading = analogRead(lightPin);\n  int numLEDSLit = reading / 57; // 1k rezistor uchun\n\n  leds = 0;\n  for (int i = 0; i < numLEDSLit && i < 8; i++) {\n    bitSet(leds, i);\n  }\n  updateShiftRegister();\n\n  delay(100);\n}\n"}]}, {"n": 27, "title": "74HC595 And Segment Display (1 raqamli 7-segment)", "notes": ["DS->Pin2, ST_CP(latch)->Pin3, SH_CP(clock)->Pin4", "Umumiy katod displey, 0-9 raqamlarni ketma-ket ko'rsatadi."], "files": [{"name": "Lesson_27_7Segment_74HC595.ino", "code": "/*\n  Lesson 27: 74HC595 And Segment Display (1 raqamli 7-segment)\n  DS->Pin2, ST_CP(latch)->Pin3, SH_CP(clock)->Pin4\n  Umumiy katod displey, 0-9 raqamlarni ketma-ket ko'rsatadi.\n*/\n\nint dataPin = 2;\nint latchPin = 3;\nint clockPin = 4;\n\n// dp,a,b,c,d,e,f,g tartibida (umumiy katod uchun)\nbyte digits[10] = {\n  B00111111, // 0\n  B00000110, // 1\n  B01011011, // 2\n  B01001111, // 3\n  B01100110, // 4\n  B01101101, // 5\n  B01111101, // 6\n  B00000111, // 7\n  B01111111, // 8\n  B01101111  // 9\n};\n\nvoid setup() {\n  pinMode(latchPin, OUTPUT);\n  pinMode(dataPin, OUTPUT);\n  pinMode(clockPin, OUTPUT);\n}\n\nvoid loop() {\n  for (int i = 0; i <= 9; i++) {\n    digitalWrite(latchPin, LOW);\n    shiftOut(dataPin, clockPin, LSBFIRST, digits[i]);\n    digitalWrite(latchPin, HIGH);\n    delay(1000);\n  }\n}\n"}]}, {"n": 28, "title": "Four Digital Seven Segment Display", "notes": ["Lesson 27 bilan bir xil 74HC595 ulanishi, lekin 4 xonali displey.", "4 ta umumiy pin (digit select) -> Pin 5,6,7,8 orqali navbat bilan yoqiladi (tez skanerlash)."], "files": [{"name": "Lesson_28_4Digit_7Segment.ino", "code": "/*\n  Lesson 28: Four Digital Seven Segment Display\n  Lesson 27 bilan bir xil 74HC595 ulanishi, lekin 4 xonali displey.\n  4 ta umumiy pin (digit select) -> Pin 5,6,7,8 orqali navbat bilan yoqiladi (tez skanerlash).\n*/\n\nint dataPin = 2;\nint latchPin = 3;\nint clockPin = 4;\nint digitPins[4] = {5, 6, 7, 8}; // har bir xonaning umumiy pini\n\nbyte digits[10] = {\n  B00111111, B00000110, B01011011, B01001111, B01100110,\n  B01101101, B01111101, B00000111, B01111111, B01101111\n};\n\nint number = 1234; // ko'rsatiladigan son\n\nvoid setup() {\n  pinMode(latchPin, OUTPUT);\n  pinMode(dataPin, OUTPUT);\n  pinMode(clockPin, OUTPUT);\n  for (int i = 0; i < 4; i++) {\n    pinMode(digitPins[i], OUTPUT);\n    digitalWrite(digitPins[i], LOW); // agar umumiy anod bo'lsa HIGH qiling\n  }\n}\n\nvoid showDigit(int digit, int value) {\n  for (int i = 0; i < 4; i++) digitalWrite(digitPins[i], LOW);\n\n  digitalWrite(latchPin, LOW);\n  shiftOut(dataPin, clockPin, LSBFIRST, digits[value]);\n  digitalWrite(latchPin, HIGH);\n\n  digitalWrite(digitPins[digit], HIGH); // shu xonani yoqish\n}\n\nvoid loop() {\n  int d0 = number % 10;\n  int d1 = (number / 10) % 10;\n  int d2 = (number / 100) % 10;\n  int d3 = (number / 1000) % 10;\n\n  showDigit(0, d3); delay(3);\n  showDigit(1, d2); delay(3);\n  showDigit(2, d1); delay(3);\n  showDigit(3, d0); delay(3);\n}\n"}]}, {"n": 29, "title": "DC Motors (L293D orqali)", "notes": ["M1 PWM -> Pin 5 (PWM pin), M1 yo'nalish 1 -> Pin 3, M1 yo'nalish 2 -> Pin 4", "Motor quvvat manbai (power supply module) orqali ta'minlanadi."], "files": [{"name": "Lesson_29_DC_Motors.ino", "code": "/*\n  Lesson 29: DC Motors (L293D orqali)\n  M1 PWM -> Pin 5 (PWM pin), M1 yo'nalish 1 -> Pin 3, M1 yo'nalish 2 -> Pin 4\n  Motor quvvat manbai (power supply module) orqali ta'minlanadi.\n*/\n\nint pwmPin = 5;\nint dir1Pin = 3;\nint dir2Pin = 4;\n\nvoid setup() {\n  pinMode(pwmPin, OUTPUT);\n  pinMode(dir1Pin, OUTPUT);\n  pinMode(dir2Pin, OUTPUT);\n}\n\nvoid loop() {\n  // Oldinga, maksimal tezlik\n  digitalWrite(dir1Pin, HIGH);\n  digitalWrite(dir2Pin, LOW);\n  analogWrite(pwmPin, 255);\n  delay(3000);\n\n  // To'xtash\n  analogWrite(pwmPin, 0);\n  delay(1000);\n\n  // Orqaga, maksimal tezlik\n  digitalWrite(dir1Pin, LOW);\n  digitalWrite(dir2Pin, HIGH);\n  analogWrite(pwmPin, 255);\n  delay(3000);\n\n  // To'xtash\n  analogWrite(pwmPin, 0);\n  delay(1000);\n}\n"}]}, {"n": 30, "title": "Relay Module (1 kanal)", "notes": ["VCC -> 5V, GND -> GND, IN -> Pin 7", "Relay orqali motor yoki boshqa qurilma yoqiladi/o'chiriladi."], "files": [{"name": "Lesson_30_Relay_Module.ino", "code": "/*\n  Lesson 30: Relay Module (1 kanal)\n  VCC -> 5V, GND -> GND, IN -> Pin 7\n  Relay orqali motor yoki boshqa qurilma yoqiladi/o'chiriladi.\n*/\n\nint relayPin = 7;\n\nvoid setup() {\n  pinMode(relayPin, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(relayPin, HIGH); // relay yopiladi, motor ishga tushadi\n  delay(3000);\n  digitalWrite(relayPin, LOW);  // relay ochiladi, motor to'xtaydi\n  delay(3000);\n}\n"}]}, {"n": 31, "title": "Stepper Motor (28BYJ-48 + ULN2003)", "notes": ["IN1->8, IN2->9, IN3->10, IN4->11", "Kutubxona kerak emas, Stepper.h Arduino bilan birga keladi."], "files": [{"name": "Lesson_31_Stepper_Motor.ino", "code": "/*\n  Lesson 31: Stepper Motor (28BYJ-48 + ULN2003)\n  IN1->8, IN2->9, IN3->10, IN4->11\n  Kutubxona kerak emas, Stepper.h Arduino bilan birga keladi.\n*/\n\n#include <Stepper.h>\n\nconst int stepsPerRevolution = 2048; // 28BYJ-48 uchun\n\nStepper myStepper(stepsPerRevolution, 8, 10, 9, 11);\n\nvoid setup() {\n  myStepper.setSpeed(10); // RPM\n}\n\nvoid loop() {\n  myStepper.step(stepsPerRevolution); // bir marta aylanish (soat yo'nalishi)\n  delay(1000);\n  myStepper.step(-stepsPerRevolution); // teskari aylanish\n  delay(1000);\n}\n"}]}, {"n": 32, "title": "Controlling Stepper Motor With Remote (IR pult)", "notes": ["Stepper (28BYJ-48+ULN2003): IN1-4 -> Pin 8,10,9,11", "IR qabul qilgich: Signal -> Pin 12", "Kutubxona kerak: IRremote, Stepper (ikkalasi ham)", "Pultdagi VOL+ tugmasi - bir marta oldinga aylanish, VOL- - orqaga aylanish"], "files": [{"name": "Lesson_32_Stepper_With_Remote.ino", "code": "/*\n  Lesson 32: Controlling Stepper Motor With Remote (IR pult)\n  Stepper (28BYJ-48+ULN2003): IN1-4 -> Pin 8,10,9,11\n  IR qabul qilgich: Signal -> Pin 12\n  Kutubxona kerak: IRremote, Stepper (ikkalasi ham)\n  Pultdagi VOL+ tugmasi - bir marta oldinga aylanish, VOL- - orqaga aylanish\n*/\n\n#include <IRremote.hpp>\n#include <Stepper.h>\n\nconst int stepsPerRevolution = 2048;\nStepper myStepper(stepsPerRevolution, 8, 10, 9, 11);\n\nint irPin = 12;\n\n// Odatiy pultlarda VOL+ va VOL- kodlari farq qiladi, o'z pultingiz kodini\n// Serial Monitor orqali avval o'qib oling va shu yerga moslang.\n#define CODE_VOL_PLUS  0x00\n#define CODE_VOL_MINUS 0x01\n\nvoid setup() {\n  Serial.begin(9600);\n  IrReceiver.begin(irPin);\n  myStepper.setSpeed(10);\n}\n\nvoid loop() {\n  if (IrReceiver.decode()) {\n    uint32_t code = IrReceiver.decodedIRData.decodedRawData;\n    Serial.println(code, HEX); // birinchi marta shu yerdan haqiqiy kodlarni ko'ring\n\n    if (code == CODE_VOL_PLUS) {\n      myStepper.step(stepsPerRevolution);\n    } else if (code == CODE_VOL_MINUS) {\n      myStepper.step(-stepsPerRevolution);\n    }\n    IrReceiver.resume();\n  }\n}\n"}]}, {"n": 33, "title": "Controlling Stepper Motor With Rotary Encoder", "notes": ["Stepper (28BYJ-48+ULN2003): IN1-4 -> Pin 8,10,9,11", "Rotary Encoder: CLK -> Pin 2, DT -> Pin 3, SW(tugma) -> Pin 4", "Encoderni burish bilan motor shu yo'nalishda aylanadi;", "tugmani bosish motorni boshlang'ich holatga qaytaradi."], "files": [{"name": "Lesson_33_Stepper_With_Rotary_Encoder.ino", "code": "/*\n  Lesson 33: Controlling Stepper Motor With Rotary Encoder\n  Stepper (28BYJ-48+ULN2003): IN1-4 -> Pin 8,10,9,11\n  Rotary Encoder: CLK -> Pin 2, DT -> Pin 3, SW(tugma) -> Pin 4\n  Encoderni burish bilan motor shu yo'nalishda aylanadi;\n  tugmani bosish motorni boshlang'ich holatga qaytaradi.\n*/\n\n#include <Stepper.h>\n\nconst int stepsPerRevolution = 2048;\nStepper myStepper(stepsPerRevolution, 8, 10, 9, 11);\n\nint clkPin = 2;\nint dtPin = 3;\nint swPin = 4;\n\nint lastClkState;\nlong currentPosition = 0;\n\nvoid setup() {\n  pinMode(clkPin, INPUT);\n  pinMode(dtPin, INPUT);\n  pinMode(swPin, INPUT_PULLUP);\n\n  myStepper.setSpeed(10);\n  lastClkState = digitalRead(clkPin);\n\n  Serial.begin(9600);\n}\n\nvoid loop() {\n  int clkState = digitalRead(clkPin);\n\n  if (clkState != lastClkState) {\n    if (digitalRead(dtPin) != clkState) {\n      myStepper.step(10);   // soat yo'nalishi\n      currentPosition += 10;\n    } else {\n      myStepper.step(-10);  // teskari yo'nalish\n      currentPosition -= 10;\n    }\n    Serial.println(currentPosition);\n  }\n  lastClkState = clkState;\n\n  if (digitalRead(swPin) == LOW) {\n    // Boshlang'ich holatga qaytarish\n    myStepper.step(-currentPosition);\n    currentPosition = 0;\n    Serial.println(\"Boshlang'ich holatga qaytdi\");\n    delay(500); // tugma sakrashini oldini olish\n  }\n}\n"}]}];
const P = [{"n": "p1", "title": "Robo sumo", "notes": ["Maqsad: raqibni qora doira (dojo) chegarasidan itarib chiqarish.", "Motorlar: L298N (ENA->5, IN1->7, IN2->8, IN3->9, IN4->10, ENB->6)", "HC-SR04: Trig -> 11, Echo -> 12", "Chiziq sensori (TCRT5000): chap OUT -> 2, o'ng OUT -> 3", "Kutubxona kerak emas.", "Sensor oq chegarada HIGH yoki LOW bersa, ON_EDGE qiymatini o'zgartiring."], "files": [{"name": "Project_01_Robo_Sumo.ino", "code": "/*\n  Loyiha 1: Robo sumo\n  Maqsad: raqibni qora doira (dojo) chegarasidan itarib chiqarish.\n  Motorlar: L298N (ENA->5, IN1->7, IN2->8, IN3->9, IN4->10, ENB->6)\n  HC-SR04: Trig -> 11, Echo -> 12\n  Chiziq sensori (TCRT5000): chap OUT -> 2, o'ng OUT -> 3\n  Kutubxona kerak emas.\n  Sensor oq chegarada HIGH yoki LOW bersa, ON_EDGE qiymatini o'zgartiring.\n*/\n\nconst int ENA = 5, IN1 = 7, IN2 = 8, IN3 = 9, IN4 = 10, ENB = 6;\n\n// Tezlik: -255 (orqaga) ... 0 (to'xtash) ... 255 (oldinga)\nvoid drive(int left, int right) {\n  digitalWrite(IN1, left > 0);\n  digitalWrite(IN2, left < 0);\n  analogWrite(ENA, abs(left));\n  digitalWrite(IN3, right > 0);\n  digitalWrite(IN4, right < 0);\n  analogWrite(ENB, abs(right));\n}\n\nvoid motorsSetup() {\n  int pins[] = {ENA, IN1, IN2, IN3, IN4, ENB};\n  for (int i = 0; i < 6; i++) pinMode(pins[i], OUTPUT);\n}\n\nconst int TRIG = 11, ECHO = 12;\nconst int LINE_L = 2, LINE_R = 3;\nconst int ON_EDGE = LOW;   // oq chegarani ko'rganda sensor qiymati\n\nlong distanceCm() {\n  digitalWrite(TRIG, LOW);  delayMicroseconds(2);\n  digitalWrite(TRIG, HIGH); delayMicroseconds(10);\n  digitalWrite(TRIG, LOW);\n  long t = pulseIn(ECHO, HIGH, 25000);   // 25 ms kutish\n  return t * 0.034 / 2;                  // 0 = hech narsa eshitilmadi\n}\n\nvoid setup() {\n  motorsSetup();\n  pinMode(TRIG, OUTPUT);\n  pinMode(ECHO, INPUT);\n  pinMode(LINE_L, INPUT);\n  pinMode(LINE_R, INPUT);\n  delay(5000);   // musobaqa qoidasi: boshlashdan oldin 5 soniya\n}\n\nvoid loop() {\n  bool left = digitalRead(LINE_L) == ON_EDGE;\n  bool right = digitalRead(LINE_R) == ON_EDGE;\n\n  if (left && right) {            // ikkalasi chegarada: orqaga va burilish\n    drive(-255, -255); delay(300);\n    drive(255, -255);  delay(250);\n    return;\n  }\n  if (left) {                     // chap chegarada: orqaga, o'ngga burilish\n    drive(-200, -200); delay(200);\n    drive(200, -200);  delay(200);\n    return;\n  }\n  if (right) {                    // o'ng chegarada: orqaga, chapga burilish\n    drive(-200, -200); delay(200);\n    drive(-200, 200);  delay(200);\n    return;\n  }\n\n  long d = distanceCm();\n  if (d > 0 && d < 35) {\n    drive(255, 255);              // raqib topildi: hujum\n  } else {\n    drive(150, -150);             // raqibni qidirib aylanish\n  }\n}\n"}]}, {"n": "p2", "title": "Robo futbol (Bluetooth bilan boshqariladigan)", "notes": ["Motorlar: L298N (ENA->5, IN1->7, IN2->8, IN3->9, IN4->10, ENB->6)", "HC-05: modul TXD -> Arduino 11, modul RXD -> Arduino 12 (1k + 2k bo'luvchi orqali)", "Zarba servosi: signal -> 3", "Kutubxona: SoftwareSerial va Servo (Arduino IDE bilan birga keladi)", "Telefonda har qanday Bluetooth terminal / RC mashina ilovasidan buyruq yuboring:", "F oldinga, B orqaga, L chapga, R o'ngga, S to'xtash, K zarba, 0-9 tezlik."], "files": [{"name": "Project_02_Robo_Futbol.ino", "code": "/*\n  Loyiha 2: Robo futbol (Bluetooth bilan boshqariladigan)\n  Motorlar: L298N (ENA->5, IN1->7, IN2->8, IN3->9, IN4->10, ENB->6)\n  HC-05: modul TXD -> Arduino 11, modul RXD -> Arduino 12 (1k + 2k bo'luvchi orqali)\n  Zarba servosi: signal -> 3\n  Kutubxona: SoftwareSerial va Servo (Arduino IDE bilan birga keladi)\n  Telefonda har qanday Bluetooth terminal / RC mashina ilovasidan buyruq yuboring:\n  F oldinga, B orqaga, L chapga, R o'ngga, S to'xtash, K zarba, 0-9 tezlik.\n*/\n\n#include <SoftwareSerial.h>\n#include <Servo.h>\n\nconst int ENA = 5, IN1 = 7, IN2 = 8, IN3 = 9, IN4 = 10, ENB = 6;\n\n// Tezlik: -255 (orqaga) ... 0 (to'xtash) ... 255 (oldinga)\nvoid drive(int left, int right) {\n  digitalWrite(IN1, left > 0);\n  digitalWrite(IN2, left < 0);\n  analogWrite(ENA, abs(left));\n  digitalWrite(IN3, right > 0);\n  digitalWrite(IN4, right < 0);\n  analogWrite(ENB, abs(right));\n}\n\nvoid motorsSetup() {\n  int pins[] = {ENA, IN1, IN2, IN3, IN4, ENB};\n  for (int i = 0; i < 6; i++) pinMode(pins[i], OUTPUT);\n}\n\nSoftwareSerial bt(11, 12);   // RX, TX\nServo kicker;\nint spd = 200;\n\nvoid kick() {\n  kicker.write(90);  // to'pga zarba\n  delay(200);\n  kicker.write(0);   // boshlang'ich holat\n}\n\nvoid setup() {\n  motorsSetup();\n  bt.begin(9600);\n  kicker.attach(3);\n  kicker.write(0);\n}\n\nvoid loop() {\n  if (!bt.available()) return;\n  char c = bt.read();\n\n  switch (c) {\n    case 'F': drive(spd, spd);   break;\n    case 'B': drive(-spd, -spd); break;\n    case 'L': drive(-spd, spd);  break;\n    case 'R': drive(spd, -spd);  break;\n    case 'S': drive(0, 0);       break;\n    case 'K': kick();            break;\n    default:\n      if (c >= '0' && c <= '9') spd = map(c - '0', 0, 9, 100, 255);\n  }\n}\n"}]}, {"n": "p3", "title": "Chiziqdan yuruvchi robot (Line follower)", "notes": ["Motorlar: L298N (ENA->5, IN1->7, IN2->8, IN3->9, IN4->10, ENB->6)", "3 ta IR chiziq sensori: chap -> 2, o'rta -> 3, o'ng -> 4", "Kutubxona kerak emas.", "Oq yuzada qora chiziq. Sensor qora chiziqda LOW bersa, ON_LINE ni LOW qiling."], "files": [{"name": "Project_03_Chiziqdan_Yuruvchi.ino", "code": "/*\n  Loyiha 3: Chiziqdan yuruvchi robot (Line follower)\n  Motorlar: L298N (ENA->5, IN1->7, IN2->8, IN3->9, IN4->10, ENB->6)\n  3 ta IR chiziq sensori: chap -> 2, o'rta -> 3, o'ng -> 4\n  Kutubxona kerak emas.\n  Oq yuzada qora chiziq. Sensor qora chiziqda LOW bersa, ON_LINE ni LOW qiling.\n*/\n\nconst int ENA = 5, IN1 = 7, IN2 = 8, IN3 = 9, IN4 = 10, ENB = 6;\n\n// Tezlik: -255 (orqaga) ... 0 (to'xtash) ... 255 (oldinga)\nvoid drive(int left, int right) {\n  digitalWrite(IN1, left > 0);\n  digitalWrite(IN2, left < 0);\n  analogWrite(ENA, abs(left));\n  digitalWrite(IN3, right > 0);\n  digitalWrite(IN4, right < 0);\n  analogWrite(ENB, abs(right));\n}\n\nvoid motorsSetup() {\n  int pins[] = {ENA, IN1, IN2, IN3, IN4, ENB};\n  for (int i = 0; i < 6; i++) pinMode(pins[i], OUTPUT);\n}\n\nconst int S_L = 2, S_C = 3, S_R = 4;\nconst int ON_LINE = HIGH;\nconst int BASE = 150;\nint lastDir = 0;   // -1 chap, 1 o'ng\n\nvoid setup() {\n  motorsSetup();\n  pinMode(S_L, INPUT);\n  pinMode(S_C, INPUT);\n  pinMode(S_R, INPUT);\n}\n\nvoid loop() {\n  bool l = digitalRead(S_L) == ON_LINE;\n  bool c = digitalRead(S_C) == ON_LINE;\n  bool r = digitalRead(S_R) == ON_LINE;\n\n  if (c && !l && !r) {\n    drive(BASE, BASE);            // chiziq o'rtada: to'g'ri\n  } else if (l && !r) {\n    drive(0, BASE);  lastDir = -1; // chiziq chapda: chapga burilish\n  } else if (r && !l) {\n    drive(BASE, 0);  lastDir = 1;  // chiziq o'ngda: o'ngga burilish\n  } else if (!l && !c && !r) {\n    // chiziq yo'qoldi: oxirgi tomonga aylanib qidirish\n    if (lastDir < 0) drive(-120, 120); else drive(120, -120);\n  } else {\n    drive(BASE, BASE);\n  }\n}\n"}]}, {"n": "p4", "title": "To'siqdan qochuvchi robot", "notes": ["Motorlar: L298N (ENA->5, IN1->7, IN2->8, IN3->9, IN4->10, ENB->6)", "HC-SR04: Trig -> 11, Echo -> 12 (servo ustiga o'rnatiladi)", "Servo: signal -> 3", "Kutubxona: Servo (Arduino IDE bilan birga keladi)"], "files": [{"name": "Project_04_Tosiqdan_Qochuvchi.ino", "code": "/*\n  Loyiha 4: To'siqdan qochuvchi robot\n  Motorlar: L298N (ENA->5, IN1->7, IN2->8, IN3->9, IN4->10, ENB->6)\n  HC-SR04: Trig -> 11, Echo -> 12 (servo ustiga o'rnatiladi)\n  Servo: signal -> 3\n  Kutubxona: Servo (Arduino IDE bilan birga keladi)\n*/\n\n#include <Servo.h>\n\nconst int ENA = 5, IN1 = 7, IN2 = 8, IN3 = 9, IN4 = 10, ENB = 6;\n\n// Tezlik: -255 (orqaga) ... 0 (to'xtash) ... 255 (oldinga)\nvoid drive(int left, int right) {\n  digitalWrite(IN1, left > 0);\n  digitalWrite(IN2, left < 0);\n  analogWrite(ENA, abs(left));\n  digitalWrite(IN3, right > 0);\n  digitalWrite(IN4, right < 0);\n  analogWrite(ENB, abs(right));\n}\n\nvoid motorsSetup() {\n  int pins[] = {ENA, IN1, IN2, IN3, IN4, ENB};\n  for (int i = 0; i < 6; i++) pinMode(pins[i], OUTPUT);\n}\n\nconst int TRIG = 11, ECHO = 12;\nServo head;\n\nlong distanceCm() {\n  digitalWrite(TRIG, LOW);  delayMicroseconds(2);\n  digitalWrite(TRIG, HIGH); delayMicroseconds(10);\n  digitalWrite(TRIG, LOW);\n  long t = pulseIn(ECHO, HIGH, 25000);   // 25 ms kutish\n  return t * 0.034 / 2;                  // 0 = hech narsa eshitilmadi\n}\n\nint look(int angle) {\n  head.write(angle);\n  delay(400);\n  long d = distanceCm();\n  return d == 0 ? 200 : d;   // 0 = bo'sh joy\n}\n\nvoid setup() {\n  motorsSetup();\n  pinMode(TRIG, OUTPUT);\n  pinMode(ECHO, INPUT);\n  head.attach(3);\n  head.write(90);\n}\n\nvoid loop() {\n  long d = distanceCm();\n  if (d > 0 && d < 25) {\n    drive(0, 0);\n    delay(100);\n    drive(-150, -150);          // biroz orqaga\n    delay(300);\n    drive(0, 0);\n\n    int right = look(30);       // o'ng tomonni tekshirish\n    int left = look(150);       // chap tomonni tekshirish\n    head.write(90);\n\n    if (right > left) drive(180, -180); else drive(-180, 180);\n    delay(400);\n    drive(0, 0);\n  } else {\n    drive(170, 170);\n  }\n}\n"}]}, {"n": "p5", "title": "Robot qo'li (joystick bilan)", "notes": ["Joystick: VCC -> 5V, GND -> GND, X -> A0, Y -> A1, Key -> 2", "Servolar: asos -> 9, yelka -> 10, tutqich -> 11", "Servolarni alohida 5V manbadan ta'minlang, GND larni umumiy qiling.", "Kutubxona: Servo (Arduino IDE bilan birga keladi)", "X: asosni buradi, Y: yelkani ko'taradi, tugma: tutqichni ochadi/yopadi."], "files": [{"name": "Project_05_Robot_Qoli.ino", "code": "/*\n  Loyiha 5: Robot qo'li (joystick bilan)\n  Joystick: VCC -> 5V, GND -> GND, X -> A0, Y -> A1, Key -> 2\n  Servolar: asos -> 9, yelka -> 10, tutqich -> 11\n  Servolarni alohida 5V manbadan ta'minlang, GND larni umumiy qiling.\n  Kutubxona: Servo (Arduino IDE bilan birga keladi)\n  X: asosni buradi, Y: yelkani ko'taradi, tugma: tutqichni ochadi/yopadi.\n*/\n\n#include <Servo.h>\n\nServo base, arm, grip;\nint basePos = 90, armPos = 90;\nbool gripOpen = false;\n\nvoid setup() {\n  pinMode(2, INPUT_PULLUP);\n  base.attach(9);\n  arm.attach(10);\n  grip.attach(11);\n  base.write(basePos);\n  arm.write(armPos);\n  grip.write(30);\n}\n\nvoid loop() {\n  int x = analogRead(A0);\n  int y = analogRead(A1);\n\n  if (x < 400) basePos = constrain(basePos - 1, 0, 180);\n  else if (x > 620) basePos = constrain(basePos + 1, 0, 180);\n\n  if (y < 400) armPos = constrain(armPos - 1, 0, 180);\n  else if (y > 620) armPos = constrain(armPos + 1, 0, 180);\n\n  base.write(basePos);\n  arm.write(armPos);\n\n  if (digitalRead(2) == LOW) {\n    gripOpen = !gripOpen;\n    grip.write(gripOpen ? 90 : 30);\n    delay(300);   // tugma sakrashini oldini olish\n  }\n  delay(15);\n}\n"}]}, {"n": "p6", "title": "Aqlli axlat qutisi", "notes": ["Qo'l yaqinlashganda qopqoq o'zi ochiladi.", "HC-SR04: VCC -> 5V, GND -> GND, Trig -> 11, Echo -> 12", "Servo (qopqoq): signal -> 6", "Kutubxona: Servo (Arduino IDE bilan birga keladi)"], "files": [{"name": "Project_06_Aqlli_Axlat_Qutisi.ino", "code": "/*\n  Loyiha 6: Aqlli axlat qutisi\n  Qo'l yaqinlashganda qopqoq o'zi ochiladi.\n  HC-SR04: VCC -> 5V, GND -> GND, Trig -> 11, Echo -> 12\n  Servo (qopqoq): signal -> 6\n  Kutubxona: Servo (Arduino IDE bilan birga keladi)\n*/\n\n#include <Servo.h>\n\nconst int TRIG = 11, ECHO = 12;\nServo lid;\n\nlong distanceCm() {\n  digitalWrite(TRIG, LOW);  delayMicroseconds(2);\n  digitalWrite(TRIG, HIGH); delayMicroseconds(10);\n  digitalWrite(TRIG, LOW);\n  long t = pulseIn(ECHO, HIGH, 25000);   // 25 ms kutish\n  return t * 0.034 / 2;                  // 0 = hech narsa eshitilmadi\n}\n\nvoid setup() {\n  pinMode(TRIG, OUTPUT);\n  pinMode(ECHO, INPUT);\n  lid.attach(6);\n  lid.write(0);   // yopiq\n}\n\nvoid loop() {\n  long d = distanceCm();\n  if (d > 0 && d < 20) {\n    lid.write(90);    // qopqoq function hl(code){
  let out = '', last = 0, m;
  RX.lastIndex = 0;
  while ((m = RX.exec(code))) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'p' : m[4] ? 'k' : 'd';

  }
  return out + esc(code.slice(last));
}

function diagram(n){
  const spec = DG[n]; if (!spec) return '';
  const RH = 28, GH = 34, XU = 170, XC = 430;
  let y = 0; const rows = [], boxes = [];
  spec.slice(1).forEach(g => {
    const top = y; y += GH;
    g.slice(1).forEach(c => { const i = c.indexOf('>'); rows.push({u: c.slice(0, i), p: c.slice(i + 1), y: y + RH / 2}); y += RH; });
    boxes.push({t: g[0], top, h: y - top}); y += 14;
  });
  const compH = y - 14;
  const order = []; rows.forEach(r => { if (!order.includes(r.u)) order.push(r.u); });
  const un = order.length, step = Math.min(RH, 30);
  const unoH = (un - 1) * step + 64;
  const H = Math.max(compH, unoH) + 24;
  const oc = (H - compH) / 2, ou = (H - unoH) / 2;
  const uy = {}; order.forEach((u, i) => uy[u] = ou + 42 + i * step);
  const pal = ['#2b7de9', '#1a9b6b', '#8e44ad', '#e07b00', '#c2185b', '#00838f'];
  const col = {}; let k = 0;
  order.forEach(u => { col[u] = u === '5V' ? '#d93025' : u === '3.3V' ? '#f29900' : u === 'GND' ? '#6b7a85' : pal[k++ % pal.length]; });
  let s = '<svg class="dg" viewBox="0 0 660 ' + H + '" role="img" aria-label="ulanish chizmasi">';
  rows.forEach(r => {
    const y2 = r.y + oc, y1 = uy[r.u];
    s += '<path d="M' + XU + ',' + y1 + ' C' + (XU + 140) + ',' + y1 + ' ' + (XC - 140) + ',' + y2 + ' ' + XC + ',' + y2 + '" stroke="' + col[r.u] + '" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
  });
  s += '<rect x="10" y="' + ou + '" width="' + (XU - 10) + '" height="' + unoH + '" rx="8" class="bx"/><text x="' + (10 + (XU - 10) / 2) + '" y="' + (ou + 24) + '" text-anchor="middle" class="tt">Arduino UNO</text>';
  order.forEach(u => { s += '<circle cx="' + XU + '" cy="' + uy[u] + '" r="5" fill="' + col[u] + '"/><text x="' + (XU - 14) + '" y="' + (uy[u] + 5) + '" text-anchor="end" class="lb">' + u + '</text>'; });
  boxes.forEach(b => { s += '<rect x="' + XC + '" y="' + (b.top + oc) + '" width="220" height="' + b.h + '" rx="8" class="bx"/><text x="' + (XC + 12) + '" y="' + (b.top + oc + 22) + '" class="tt">' + esc(b.t) + '</text>'; });
  rows.forEach(r => { s += '<circle cx="' + XC + '" cy="' + (r.y + oc) + '" r="5" fill="' + col[r.u] + '"/><text x="' + (XC + 14) + '" y="' + (r.y + oc + 5) + '" class="lb">' + esc(r.p) + '</text>'; });
  s += '</svg>';
  return '<div class="fig">' + s + (spec[0] ? '<p class="cap">' + esc(spec[0]) + '</p>' : '') + '<p class="cap">Sxema kod boshidagi izohda ko’rsatilgan pinlarga asoslangan.</p></div>';
}

  $('#main').style.setProperty('--a', 'var(--b)');
  $('#main').innerHTML =
    '<h1>Arduino darslari</h1>' +
    '<p class="lead">KUONGSHUN UNO starter kit uchun ' + L.length + ' ta dars kodi. Darsni tanlang, kodni nusxalang yoki .ino fayl sifatida yuklab oling.</p>' +
    '<h2>Kodni platagaga qanday yuklash kerak</h2>' +
    '<ol class="steps"><li>Arduino IDE ni oching (yo\'q bo\'lsa, arduino.cc/en/software dan yuklab oling).</li>' +
    '<li>Kodni nusxalang va IDE\'da yangi sketch ichiga qo\'ying, yoki yuklab olingan .ino faylni 2 marta bosib oching.</li>' +
    '<li>Tools &gt; Board dan «Arduino Uno» ni tanlang.</li>' +
    '<li>Tools &gt; Port dan plata ulangan COM portni tanlang.</li>' +
    '<li>Komponentlarni dars sahifasidagi ulash tartibiga qarab ulang.</li>' +
    '<li>Yuqoridagi Upload (o\'ngga qaragan strelka) tugmasini bosing.</li></ol>' +
    '<div class="note warn"><b>Kutubxonalar.</b> Ba\'zi darslarga qo\'shimcha kutubxona kerak. Arduino IDE\'da Sketch &gt; Include Library &gt; Manage Libraries orqali o\'rnating. Kerakli nom dars sahifasida ko\'rsatilgan.</div>' +
    '<div class="note ok"><b>Eslatma.</b> Pin raqamlari asl darslikdagi sxemalarga asoslangan. Kitingizda boshqa pin bo\'lsa, kodning tepasidagi pin raqamlarini o\'zgartiring.</div>' +
    '<h2>Robot loyihalari</h2><p class="lead">Robo sumo, robo futbol va boshqa robotlar uchun tayyor kodlar. Ko\'pchiligi L298N motor drayveri bilan ishlaydi.</p><ul class="grid">' + P.map((x, i) => '<li><a href="#/' + x.n + '" style="--a:' + AC(i) + '"><span class="n">' + pad(+x.n.slice(1)) + '</span><span>' + esc(x.title) + '</span></a></li>').join('') + '</ul>' +
    OTG() +
    '<h2>Barcha darslar</h2><ul class="grid">' +
    L.map(x => '<li><a href="#/' + x.n + '" style="--a:' + AC(x.n) + '"><span class="n">' + pad(x.n) + '</span><span>' + esc(x.title) + '</span></a></li>').join('') + '</ul>';
}
function OTG(){ return '<h2>Telefondan OTG kabel bilan yuklash</h2>' +
    '<p class="lead">Android brauzeri USB orqali plataga to\'g\'ridan-to\'g\'ri yozolmaydi, shuning uchun kodni saytning o\'zidan yuklab bo\'lmaydi. Buning uchun kodni kompilyatsiya qilib yuklay oladigan Android ilovasi kerak (masalan, ArduinoDroid). Ilovalar turlicha, qadamlar umumiy:</p>' +
    '<ol class="steps"><li>Dars sahifasida «Nusxalash» tugmasini bosing.</li><li>Ilovada yangi sketch ochib, kodni qo\'ying.</li><li>Arduino UNO\'ni OTG kabel bilan telefonga ulang va USB ruxsatini tasdiqlang.</li><li>Ilovada plata sifatida Arduino Uno\'ni tanlab, Upload bosing.</li></ol>' +
    '<div class="note warn">Kutubxona kerak bo\'lgan darslarda kutubxonani ilovaning o\'zida ham o\'rnatish kerak bo\'lishi mumkin.</div>'; }
function otg(){
  document.title = 'Telefondan yuklash — Arduino darslari';
  $('#main').style.setProperty('--a', 'var(--g)');
  delete $('#main').dataset.n;
  $('#main').innerHTML = '<h1>Telefondan yuklash</h1>' + OTG();
}
function project(id){
  const i = P.findIndex(x => x.n === id);
  if (i < 0) return home();
  const x = P[i], prev = P[i-1], next = P[i+1];
  document.title = x.title + ' — Robot loyihalari';
  $('#main').dataset.n = id;
  $('#main').style.setProperty('--a', AC(i));
  $('#main').innerHTML =
    '<span class="chip">Loyiha ' + id.slice(1) + '</span><h1>' + esc(x.title) + '</h1>' +
    '<h2>Ulanish va izoh</h2><div class="card">' + x.notes.map(noteHtml).join('') + '</div>' +
    '<h2>Ulanish chizmasi</h2>' + diagram(id) + '<h2>Kod</h2>' +
    x.files.map((f, k) => '<div class="code"><div class="bar"><span>' + esc(f.name) + '</span><div>' +
      '<button class="btn" data-copy="' + k + '">Nusxalash</button><button class="btn" data-dl="' + k + '">Yuklab olish</button></div></div>' +
      '<pre><code>' + hl(f.code) + '</code></pre></div>').join('') +
    '<div class="pn"><span>' + (prev ? '<a class="btn" href="#/' + prev.n + '">← ' + esc(prev.title) + '</a>' : '') + '</span>' +
    '<span>' + (next ? '<a class="btn pri" style="--a:' + AC(i + 1) + '" href="#/' + next.n + '">' + esc(next.title) + ' →</a>' : '') + '</span></div>';
}
function lesson(n){
  const i = L.findIndex(x => x.n === n);
  if (i < 0) return home();
  const x = L[i];
  document.title = x.n + '-dars: ' + x.title + ' — Arduino darslari';
  const prev = L[i-1], next = L[i+1];
  $('#main').innerHTML =
    '<span class="chip">' + x.n + '-dars</span><h1>' + esc(x.title) + '</h1>' +
    '<h2>Ulanish va izoh</h2><div class="card">' + x.notes.map(noteHtml).join('') + '</div>' +
    '<h2>Ulanish chizmasi</h2>' + diagram(x.n) + '<h2>Kod</h2><div class="note ok">Telefondan OTG kabel bilan yuklash uchun <a href="#/otg">qadamlarni ko\'ring</a>.</div>' +
    x.files.map((f, k) => '<div class="code"><div class="bar"><span>' + esc(f.name) + '</span><div>' +
      '<button class="btn" data-copy="' + k + '">Nusxalash</button><button class="btn" data-dl="' + k + '">Yuklab olish</button></div></div>' +
      '<pre><code>' + hl(f.code) + '</code></pre></div>').join('') +
    '<div class="pn"><span>' + (prev ? '<a class="btn" href="#/' + prev.n + '">← ' + prev.n + '. ' + esc(prev.title) + '</a>' : '') + '</span>' +
    '<span>' + (next ? '<a class="btn pri" style="--a:' + AC(next.n) + '" href="#/' + next.n + '">' + next.n + '. ' + esc(next.title) + ' →</a>' : '') + '</span></div>';
  $('#main').dataset.n = n;
  $('#main').style.setProperty('--a', AC(n));
}
function route(){
  const m = location.hash.match(/^#\/(\d+)/);
  const pm = location.hash.match(/^#\/(p\d+)/);
  location.hash === '#/otg' ? otg() : pm ? project(pm[1]) : m ? lesson(+m[1]) : home();
  mark();
  $('#side').classList.remove('open');
  $('#menu').setAttribute('aria-expanded', 'false');
  window.scrollTo(0, 0);
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  try {
    const a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0';
    document.body.appendChild(a); a.select(); const ok = document.execCommand('copy'); a.remove(); return ok;
  } catch (e) { return false; }
}
$('#main').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const key = $('#main').dataset.n;
  const x = L.concat(P).find(l => String(l.n) === key); if (!x) return;
  if (b.dataset.copy !== undefined) {
    const ok = await copyText(x.files[+b.dataset.copy].code);
    const t = b.textContent; b.textContent = ok ? 'Nusxalandi' : 'Nusxalab bo\'lmadi';
    setTimeout(() => b.textContent = t, 1500);
  } else if (b.dataset.dl !== undefined) {
    const f = x.files[+b.dataset.dl];
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([f.code], {type: 'text/plain'}));
    a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
});
$('#q').addEventListener('input', e => renderList(e.target.value));
$('#menu').addEventListener('click', () => {
  const o = $('#side').classList.toggle('open');
  $('#menu').setAttribute('aria-expanded', String(o));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('#side').classList.remove('open'); $('#menu').setAttribute('aria-expanded','false'); } });
window.addEventListener('hashchange', route);
renderList(); route();
</script>
</body>
</html>
